# sinkhole_inetsim.conf: INetSim & Local DNS/HTTP Sinkhole Configuration for dbug
# Used for safe, fully isolated C2 simulation when external egress is disabled.

# ------------------------------------------------------------------------------
# 1. DNS Emulation (dnsmasq / inetsim)
# ------------------------------------------------------------------------------
# Resolves all outbound DNS queries from the Android test device to the gateway sinkhole IP
service_bind_address            192.168.44.1
dns_bind_port                   53
dns_default_ip                  192.168.44.1

# Emulated domain overrides for common C2 / CDN services
dns_static_entry                api.telegram.org        192.168.44.1
dns_static_entry                discord.com             192.168.44.1
dns_static_entry                api.ipify.org           192.168.44.1
dns_static_entry                checkip.amazonaws.com   192.168.44.1

# ------------------------------------------------------------------------------
# 2. HTTP / HTTPS Emulation
# ------------------------------------------------------------------------------
# Simulates generic web responses to satisfy malware initial check-ins
http_bind_port                  80
https_bind_port                 443

# Default response headers
http_server_header              Apache/2.4.52 (Ubuntu)

# Telegram Bot API mock response
# Infostealers often check {"ok": true} before proceeding with exfiltration
http_fake_telegram_response     {"ok": true, "result": {"message_id": 9999, "chat": {"id": 123456789}}}

# ------------------------------------------------------------------------------
# 3. Raw TCP Socket Emulation
# ------------------------------------------------------------------------------
# Listens on arbitrary ports (e.g., 8888, 7777, 9999) to emulate C2 socket daemons
generic_tcp_ports               5555, 6666, 7777, 8888, 9999, 12345, 31337
generic_tcp_banner              OK\n
